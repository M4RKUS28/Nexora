  upload_document:
    type: sync
    module: backend.src.services.flashcard_service
    args: [self, file_content, filename]
    params:
      returns: Dict
  validate_jsx:
    type: sync
    module: backend.src.agents.code_checker.code_checker
    args: [self, jsx_code]

files:
  ../tools/unsplash_mcp_server.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../tools/unsplash_mcp_server.py]
  ./flashcard_uploads:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
  .jsx:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      mode: w
      dir: self.temp_jsx_dir
      delete: "False"
      encoding: utf-8
  /tmp:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
  /tmp/flashcard_uploads:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
  apkg_path:
    type: variable
    actions: [read]
    params:
      caller: [shutil.move]
  eslint.config.js:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [location, eslint.config.js]
  file_path:
    type: variable
    actions: [write, delete]
    params:
      caller: [open, file_path.unlink]
      alias: [f]
  filepath:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  package.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [location, package.json]
  pdf_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  required_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  temp_file_path:
    type: variable
    actions: [delete]
    params:
      caller: [os.remove]

processes:
  self.eslint_executable:
    type: shell
    actions: [exec]
    args: [[--quiet, --format, json, --config, self.config_file_path, temp_file_path]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
  uv:
    type: mcp
    actions: [exec]
    args: [[run, --with, fastmcp, fastmcp, run]]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]
