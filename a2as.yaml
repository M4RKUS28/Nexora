agents:
  agent:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: code_review_agent
      description: Agent for testing the user on studied material
      instruction: ''
      function: __init__
  agent.ChatAgent.chat_agent:
    type: class
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: chat_agent
      description: Agent for creating a small chat for a course
      instruction:
        function: load_instruction_from_file
        type: file_load
        file: chat_agent/instructions.txt
      class: ChatAgent
  agent.LearningFlashcardAgent.llm_agent:
    type: class
    models: [gemini-2.5-pro]
    params:
      name: learning_flashcard_agent
      description: Agent for generating learning flashcards from PDF content
      global_instruction: ''
      instruction: [Generate front/back learning flashcards from the provided content. Focus on key concepts and understanding.]
      class: LearningFlashcardAgent
  agent.TestingFlashcardAgent.llm_agent:
    type: class
    models: [gemini-2.5-pro]
    params:
      name: testing_flashcard_agent
      description: Agent for generating multiple choice questions from PDF content
      global_instruction: ''
      instruction: [Generate multiple choice questions from the provided text content. Focus on key concepts and create plausible
          distractors.]
      class: TestingFlashcardAgent
  explainer_agent:
    type: instance
    models: [gemini-2.5-pro]
    params:
      name: explainer_agent
      description: Agent for creating engaging visual explanations using react
      global_instruction: ''
      instruction: [END OF INSTRUCTIONS, '- - - - - -', '## Current course creation state', 'Initial Interaction:', 'Nexora:
          "What do you want to learn today?"', 'User: "{query}"', 'All chapters, created by the Planner Agent:', '{chapters_str}',
        Please only include content about the chapter that is assigned to you in the following query.]
      function: __init__
  grader_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: grader_agent
      description: Agent for testing the user on studied material
      output_schema: Grading
      instruction: ''
      disallow_transfer_to_parent: "True"
      disallow_transfer_to_peers: "True"
      function: __init__
  html_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: html_agent
      description: Agent for creating reveal.js slide decks for great explanations and visualizations.
      instruction: full_instructions
      function: __init__
  image_agent:
    type: instance
    models: [gemini-2.5-flash-lite-preview-06-17]
    tools: [unsplash_mcp_toolset]
    mcp: [unsplash_mcp_toolset]
    params:
      name: image_agent
      description: Agent for searching an image for a course using an external service.
      instruction:
        function: load_instruction_from_file
        type: file_load
        file: image_agent/instructions.txt
      after_model_callback: get_url_from_response
      function: __init__
  info_agent:
    type: instance
    models: [gemini-2.5-flash-lite-preview-06-17]
    params:
      name: info_agent
      output_schema: CourseInfo
      description: Agent for creating a small info for a course
      instruction:
        function: load_instruction_from_file
        type: file_load
        file: info_agent/instructions.txt
      disallow_transfer_to_parent: "True"
      disallow_transfer_to_peers: "True"
      function: __init__
  planner_agent:
    type: instance
    models: [gemini-2.5-flash-lite-preview-06-17]
    params:
      name: planner_agent
      description: Agent for planning Learning Paths and Courses
      output_schema: LearningPath
      instruction:
        function: load_instruction_from_file
        type: file_load
        file: planner_agent/instructions.txt
      disallow_transfer_to_parent: "True"
      disallow_transfer_to_peers: "True"
      function: __init__
  tester_agent:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: tester_agent
      description: Agent for testing the user on studied material
      output_schema: Test
      global_instruction: ''
      instruction: ['Initial User Query for Course Creation:', '{query}']
      disallow_transfer_to_parent: "True"
      disallow_transfer_to_peers: "True"
      function: __init__

models:
  gemini-2.0-flash:
    type: literal
    agents: [grader_agent]
  gemini-2.5-flash:
    type: literal
    agents: [tester_agent, agent]
  gemini-2.5-flash-lite-preview-06-17:
    type: literal
    agents: [image_agent, planner_agent, info_agent]
  gemini-2.5-flash-preview-05-20:
    type: literal
    agents: [agent.ChatAgent.chat_agent, html_agent]
  gemini-2.5-pro:
    type: literal
    agents: [agent.LearningFlashcardAgent.llm_agent, agent.TestingFlashcardAgent.llm_agent, explainer_agent]

tools:
  unsplash_mcp_toolset:
    type: mcp
    agents: [image_agent]
    params:
      class: MCPToolset
      mcp_server: unsplash_mcp_toolset

mcp:
  unsplash_mcp_toolset:
    type: process
    agents: [image_agent]
    params:
      class: MCPToolset
      connection_type: StdioServerParameters
      command: uv
      args: [run, --with, fastmcp, fastmcp, run, path_to_mcp_server]
      env:
        null: os.environ

